name: Ephemeral PR environment

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ephemeral-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  provision-test-destroy:
    # OIDC tokens on pull_request are safe only for branches in this repository.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hashicorp/setup-terraform@v4
      - name: Require external OIDC and state configuration
        env:
          ROLE_ARN: ${{ vars.AWS_EPHEMERAL_CI_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
        run: |
          test -n "$ROLE_ARN"
          test -n "$STATE_BUCKET"
      - id: aws
        name: Assume the ephemeral CI role through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_EPHEMERAL_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: findly-pr-${{ github.event.pull_request.number }}
      - name: Build Lambda artifacts
        run: |
          npm ci
          npm run build:lambdas
          npm run package:lambdas
      - name: Initialize PR-scoped, encrypted remote state
        env:
          STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/ephemeral init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=ephemeral/pr-${{ github.event.pull_request.number }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Provision an isolated PR environment
        run: |
          terraform -chdir=infra/ephemeral apply -auto-approve \
            -var="aws_region=$AWS_REGION" \
            -var="aws_account_id=$(aws sts get-caller-identity --query Account --output text)" \
            -var="pull_request_number=${{ github.event.pull_request.number }}"
      - name: Run the Floci organizer happy path
        run: |
          npm exec -- playwright install --with-deps chromium
          npm run test:e2e:local -- --project=chromium
      - name: Destroy the PR environment
        if: ${{ always() && steps.aws.outcome == 'success' }}
        env:
          STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/ephemeral init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=ephemeral/pr-${{ github.event.pull_request.number }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/ephemeral destroy -auto-approve \
            -var="aws_region=$AWS_REGION" \
            -var="aws_account_id=$(aws sts get-caller-identity --query Account --output text)" \
            -var="pull_request_number=${{ github.event.pull_request.number }}"
