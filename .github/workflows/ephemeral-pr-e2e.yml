name: Ephemeral PR environment

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ephemeral-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  provision-test-destroy:
    # OIDC tokens on pull_request are safe only for branches in this repository.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hashicorp/setup-terraform@v4
      - name: Require external OIDC and state configuration
        env:
          ROLE_ARN: ${{ vars.AWS_EPHEMERAL_CI_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
        run: |
          test -n "$ROLE_ARN"
          test -n "$STATE_BUCKET"
      - id: aws
        name: Assume the ephemeral CI role through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_EPHEMERAL_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: findly-pr-${{ github.event.pull_request.number }}
      - name: Build Lambda artifacts
        run: |
          npm ci
          npm run build:lambdas
          npm run package:lambdas
      - name: Initialize PR-scoped, encrypted remote state
        env:
          STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/ephemeral init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=ephemeral/pr-${{ github.event.pull_request.number }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Plan and verify the serverless cost boundary
        run: |
          plan_file="$RUNNER_TEMP/findly-pr-${{ github.event.pull_request.number }}.tfplan"
          plan_json="$RUNNER_TEMP/findly-pr-${{ github.event.pull_request.number }}.tfplan.json"
          terraform -chdir=infra/ephemeral plan -out="$plan_file" \
            -var="aws_region=$AWS_REGION" \
            -var="aws_account_id=$(aws sts get-caller-identity --query Account --output text)" \
            -var="pull_request_number=${{ github.event.pull_request.number }}"
          terraform -chdir=infra/ephemeral show -json "$plan_file" > "$plan_json"

          prohibited_resource_types=(
            aws_vpc
            aws_nat_gateway
            aws_instance
            aws_db_instance
            aws_db_cluster
            aws_rds_cluster_instance
            aws_lb
            aws_eks_cluster
          )
          for resource_type in "${prohibited_resource_types[@]}"; do
            if jq -e --arg resource_type "$resource_type" \
              '.resource_changes[]? | select(.mode == "managed" and .type == $resource_type)' \
              "$plan_json" > /dev/null; then
              echo "::error::The ephemeral plan contains prohibited fixed-cost resource type $resource_type"
              exit 1
            fi
          done
      - name: Provision an isolated PR environment
        run: |
          terraform -chdir=infra/ephemeral apply -auto-approve \
            -var="aws_region=$AWS_REGION" \
            -var="aws_account_id=$(aws sts get-caller-identity --query Account --output text)" \
            -var="pull_request_number=${{ github.event.pull_request.number }}"
      - name: Verify deployed uploads bucket hardening
        run: |
          uploads_bucket_name="$(terraform -chdir=infra/ephemeral output -raw uploads_bucket_name)"
          public_access_block="$(aws s3api get-public-access-block \
            --bucket "$uploads_bucket_name" \
            --query 'PublicAccessBlockConfiguration' \
            --output json)"
          bucket_encryption="$(aws s3api get-bucket-encryption \
            --bucket "$uploads_bucket_name" \
            --output json)"

          jq -e '
            .BlockPublicAcls == true and
            .IgnorePublicAcls == true and
            .BlockPublicPolicy == true and
            .RestrictPublicBuckets == true
          ' <<< "$public_access_block" > /dev/null
          jq -e '
            [.ServerSideEncryptionConfiguration.Rules[]?.ApplyServerSideEncryptionByDefault.SSEAlgorithm]
            | index("AES256") != null
          ' <<< "$bucket_encryption" > /dev/null
      - name: Run the deployed AWS organizer happy path
        run: |
          user_name="ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}"
          password="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | cut -c1-32)Aa1!"
          cleanup_user() {
            aws cognito-idp admin-delete-user \
              --user-pool-id "$(terraform -chdir=infra/ephemeral output -raw cognito_user_pool_id)" \
              --username "$user_name" || true
          }
          trap cleanup_user EXIT
          user_pool_id="$(terraform -chdir=infra/ephemeral output -raw cognito_user_pool_id)"
          client_id="$(terraform -chdir=infra/ephemeral output -raw cognito_client_id)"
          aws cognito-idp admin-create-user \
            --user-pool-id "$user_pool_id" \
            --username "$user_name" \
            --message-action SUPPRESS
          aws cognito-idp admin-set-user-password \
            --user-pool-id "$user_pool_id" \
            --username "$user_name" \
            --password "$password" \
            --permanent
          id_token="$(aws cognito-idp initiate-auth \
            --client-id "$client_id" \
            --auth-flow USER_PASSWORD_AUTH \
            --auth-parameters "USERNAME=$user_name,PASSWORD=$password" \
            --query 'AuthenticationResult.IdToken' \
            --output text)"
          test "$id_token" != "None"
          EPHEMERAL_API_ENDPOINT="$(terraform -chdir=infra/ephemeral output -raw api_endpoint)" \
          EPHEMERAL_ID_TOKEN="$id_token" \
          EPHEMERAL_DYNAMODB_TABLE_NAME="$(terraform -chdir=infra/ephemeral output -raw dynamodb_table_name)" \
          EPHEMERAL_UPLOADS_BUCKET_NAME="$(terraform -chdir=infra/ephemeral output -raw uploads_bucket_name)" \
          node scripts/deployed-ephemeral-happy-path.mjs
      - name: Destroy the PR environment
        if: ${{ always() && steps.aws.outcome == 'success' }}
        env:
          STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/ephemeral init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=ephemeral/pr-${{ github.event.pull_request.number }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/ephemeral destroy -auto-approve \
            -var="aws_region=$AWS_REGION" \
            -var="aws_account_id=$(aws sts get-caller-identity --query Account --output text)" \
            -var="pull_request_number=${{ github.event.pull_request.number }}"
