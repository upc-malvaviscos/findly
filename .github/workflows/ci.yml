name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-and-workflow-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
      - uses: DavidAnson/markdownlint-cli2-action@v19
      - uses: raven-actions/actionlint@v2
