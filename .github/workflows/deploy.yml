name: Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [sandbox, demo, production]
      apply:
        description: Apply the reviewed infrastructure and publish the SPA
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deployment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: eu-west-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_VAR_enable_web: 'true'
      TF_VAR_web_bucket_name: ${{ vars.FINDLY_WEB_BUCKET_NAME }}
      TF_VAR_uploads_bucket_name: ${{ vars.FINDLY_UPLOADS_BUCKET_NAME }}
      TF_VAR_web_domain_name: ${{ vars.FINDLY_WEB_DOMAIN_NAME }}
      TF_VAR_web_certificate_arn: ${{ vars.FINDLY_WEB_CERTIFICATE_ARN }}
      TF_VAR_frontend_domain_url: https://${{ vars.FINDLY_WEB_DOMAIN_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hashicorp/setup-terraform@v4
      - name: Require reviewed external configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$ROLE_ARN"
          test -n "$STATE_BUCKET"
          test -n "$TF_VAR_web_bucket_name"
          test -n "$TF_VAR_uploads_bucket_name"
          test -n "$TF_VAR_web_domain_name"
          test -n "$TF_VAR_web_certificate_arn"
          case "$TF_VAR_web_domain_name" in
            *.example|*replace*) echo '::error::Configure an approved real domain'; exit 1 ;;
          esac
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: findly-deploy-${{ inputs.environment }}
      - name: Install and build Lambda artifacts before planning
        run: |
          npm ci
          npm run typecheck
          npm run build:lambdas
          npm run package:lambdas
          npm run verify:lambdas
      - name: Initialize environment-scoped remote state
        run: |
          terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=findly/$TARGET_ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Plan and reject resource deletion
        run: |
          plan_file="$RUNNER_TEMP/findly-deployment.tfplan"
          terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" plan -out="$plan_file"
          terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" show -json "$plan_file" \
            | node scripts/check-deployment-plan.mjs
      - name: Apply the exact reviewed run plan
        if: ${{ inputs.apply }}
        run: terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" apply "$RUNNER_TEMP/findly-deployment.tfplan"
      - name: Build SPA with public deployed outputs and publish
        if: ${{ inputs.apply }}
        run: |
          export VITE_FINDLY_EXECUTION_MODE=aws
          export VITE_API_BASE_URL="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw api_endpoint)"
          export VITE_COGNITO_USER_POOL_ID="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw cognito_user_pool_id)"
          export VITE_COGNITO_CLIENT_ID="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw cognito_client_id)"
          export VITE_COGNITO_REGION="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw cognito_region)"
          web_bucket="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw web_bucket_name)"
          distribution_id="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw web_distribution_id)"
          test -n "$web_bucket"
          test -n "$distribution_id"
          npm run build:web
          aws s3 sync dist/ "s3://$web_bucket" --delete --exclude index.html --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/index.html "s3://$web_bucket/index.html" --cache-control 'no-cache' --content-type 'text/html'
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*'
