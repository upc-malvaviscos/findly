name: Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [sandbox, demo, production]
      enable_production_email:
        description: Enable production email only after all SES and DNS checks pass
        type: boolean
        default: false
      apply:
        description: Apply the reviewed infrastructure and publish the SPA
        type: boolean
        default: false
      prepare_demo_bindings:
        description: First demo run only - provision API and web for exact role bindings
        type: boolean
        default: false
      prepare_production_bindings:
        description: First production run only - prepare API/web for exact role bindings
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deployment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: eu-west-1
      TF_WORKSPACE: default
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      DEMO_OPERATION: deploy
      FINDLY_AWS_ACCOUNT_ID: ${{ vars.FINDLY_AWS_ACCOUNT_ID }}
      STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_VAR_uploads_bucket_name: ${{ vars.FINDLY_UPLOADS_BUCKET_NAME }}
      TF_VAR_web_bucket_name: ${{ vars.FINDLY_WEB_BUCKET_NAME }}
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Reject non-main persistent dispatch before checkout
        env:
          PREPARE_BINDINGS: ${{ inputs.prepare_demo_bindings }}
          PREPARE_PRODUCTION_BINDINGS: ${{ inputs.prepare_production_bindings }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = demo ] || [ "$TARGET_ENVIRONMENT" = production ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
          fi
          if [ "$PREPARE_BINDINGS" = true ]; then
            test "$TARGET_ENVIRONMENT" = demo
          fi
          if [ "$PREPARE_PRODUCTION_BINDINGS" = true ]; then
            test "$TARGET_ENVIRONMENT" = production
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Authorize original actor and rerun actor before credentials
        if: ${{ inputs.environment == 'demo' }}
        run: node scripts/check-demo-operation.mjs
      - name: Authorize production before credentials
        if: ${{ inputs.environment == 'production' }}
        run: node scripts/check-production-operation.mjs
  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: eu-west-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      DEMO_OPERATION: deploy
      FINDLY_AWS_ACCOUNT_ID: ${{ vars.FINDLY_AWS_ACCOUNT_ID }}
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_VAR_enable_web: 'true'
      TF_VAR_web_bucket_name: ${{ vars.FINDLY_WEB_BUCKET_NAME }}
      TF_VAR_uploads_bucket_name: ${{ vars.FINDLY_UPLOADS_BUCKET_NAME }}
      TF_VAR_web_domain_name: ${{ vars.FINDLY_WEB_DOMAIN_NAME }}
      TF_VAR_web_certificate_arn: ${{ vars.FINDLY_WEB_CERTIFICATE_ARN }}
      ENABLE_PRODUCTION_EMAIL: ${{ inputs.environment == 'production' && inputs.enable_production_email }}
      TF_VAR_email_identity_arn: ${{ inputs.environment == 'production' && inputs.enable_production_email && vars.FINDLY_EMAIL_IDENTITY_ARN || '' }}
      TF_VAR_email_from_address: ${{ inputs.environment == 'production' && inputs.enable_production_email && vars.FINDLY_EMAIL_FROM_ADDRESS || '' }}
      TF_VAR_email_gallery_origin: ${{ vars.FINDLY_EMAIL_GALLERY_ORIGIN || 'https://www.findly.barcelona' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hashicorp/setup-terraform@v4
      - name: Require reviewed external configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$ROLE_ARN"
          test -n "$STATE_BUCKET"
          test -n "$TF_VAR_web_bucket_name"
          test -n "$TF_VAR_uploads_bucket_name"
          if [ -z "$TF_VAR_web_domain_name" ]; then
            test "$TARGET_ENVIRONMENT" = demo
            test -z "$TF_VAR_web_certificate_arn"
          else
            case "$TF_VAR_web_certificate_arn" in
              arn:aws:acm:us-east-1:*) ;;
              *) echo '::error::Custom domain requires an ACM certificate in us-east-1'; exit 1 ;;
            esac
          fi
          case "$TF_VAR_web_domain_name" in
            *.example|*replace*) echo '::error::Configure an approved real domain'; exit 1 ;;
          esac
      - name: Reauthorize even when only the deployment job is rerun
        if: ${{ inputs.environment == 'demo' }}
        run: node scripts/check-demo-operation.mjs
      - name: Reauthorize production reruns before credentials
        if: ${{ inputs.environment == 'production' }}
        run: node scripts/check-production-operation.mjs
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: findly-deploy-${{ inputs.environment }}
          allowed-account-ids: ${{ vars.FINDLY_AWS_ACCOUNT_ID }}
      - name: Require approved production HTTPS and optional email readiness
        if: ${{ inputs.environment == 'production' }}
        run: node scripts/check-production-readiness.mjs
      - name: Install and build Lambda artifacts before planning
        run: |
          npm ci
          npm run typecheck
          npm run build:lambdas
          npm run package:lambdas
          npm run verify:lambdas
      - name: Initialize environment-scoped remote state
        run: |
          backend_args=()
          if [ "$TARGET_ENVIRONMENT" = demo ] || [ "$TARGET_ENVIRONMENT" = production ]; then
            backend_args+=("-backend-config=workspace_key_prefix=findly/$TARGET_ENVIRONMENT/workspaces")
          fi
          terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=findly/$TARGET_ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" "${backend_args[@]}"
      - name: Plan and reject resource deletion
        env:
          PREPARE_BINDINGS: ${{ inputs.prepare_demo_bindings }}
          PREPARE_PRODUCTION_BINDINGS: ${{ inputs.prepare_production_bindings }}
        run: |
          plan_file="$RUNNER_TEMP/findly-deployment.tfplan"
          if [ "$PREPARE_BINDINGS" = true ]; then
            terraform -chdir=infra/environments/demo plan -out="$plan_file" \
              -target=module.findly.module.api_gateway.aws_apigatewayv2_api.http_api \
              -target=module.findly.module.web
          elif [ "$PREPARE_PRODUCTION_BINDINGS" = true ]; then
            terraform -chdir=infra/environments/production plan -out="$plan_file" \
              -var="uploads_bucket_name=$TF_VAR_uploads_bucket_name" \
              -target=module.findly.module.api_gateway.aws_apigatewayv2_api.http_api \
              -target=module.findly.module.web
          else
            terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" plan -out="$plan_file" \
              -var="uploads_bucket_name=$TF_VAR_uploads_bucket_name"
          fi
          terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" show -json "$plan_file" \
            | node scripts/check-deployment-plan.mjs
      - name: Apply the exact reviewed run plan
        if: ${{ inputs.apply }}
        run: terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" apply "$RUNNER_TEMP/findly-deployment.tfplan"
      - name: Build SPA with public deployed outputs and publish
        if: ${{ inputs.apply && !inputs.prepare_demo_bindings && !inputs.prepare_production_bindings }}
        run: |
          export VITE_FINDLY_EXECUTION_MODE=aws
          VITE_API_BASE_URL="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw api_endpoint)"
          export VITE_API_BASE_URL
          export VITE_GALLERY_EMAIL_ENABLED="$ENABLE_PRODUCTION_EMAIL"
          VITE_COGNITO_USER_POOL_ID="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw cognito_user_pool_id)"
          export VITE_COGNITO_USER_POOL_ID
          VITE_COGNITO_CLIENT_ID="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw cognito_client_id)"
          export VITE_COGNITO_CLIENT_ID
          VITE_COGNITO_REGION="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw cognito_region)"
          export VITE_COGNITO_REGION
          web_bucket="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw web_bucket_name)"
          distribution_id="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw web_distribution_id)"
          test -n "$web_bucket"
          test -n "$distribution_id"
          npm run build:web
          aws s3 sync dist/ "s3://$web_bucket" --delete --exclude index.html --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/index.html "s3://$web_bucket/index.html" --cache-control 'no-cache' --content-type 'text/html'
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*'
          frontend_origin="$(terraform -chdir="infra/environments/$TARGET_ENVIRONMENT" output -raw frontend_origin)"
          printf 'Frontend: %s\n' "$frontend_origin" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published permanent demo without automatic destruction
        if: ${{ inputs.apply && inputs.environment == 'demo' && !inputs.prepare_demo_bindings }}
        run: |
          npm exec -- playwright install --with-deps chromium
          terraform -chdir=infra/environments/demo output -json > "$RUNNER_TEMP/demo-outputs.json"
          node scripts/test-demo.mjs "$RUNNER_TEMP/demo-outputs.json"
      - name: Verify production HTTPS and gallery route
        if: ${{ inputs.apply && inputs.environment == 'production' && !inputs.prepare_production_bindings }}
        run: node scripts/check-production-web.mjs
      - name: Report bindings preparation
        if: ${{ inputs.apply && inputs.prepare_demo_bindings }}
        run: echo 'Demo API/web prepared. Review exact API/OAC role bindings with configure-demo-roles.mjs --apply, then run a complete deployment with prepare_demo_bindings=false.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report production bindings preparation
        if: ${{ inputs.apply && inputs.prepare_production_bindings }}
        run: echo 'Production API/web prepared. Bind their exact IDs using configure-production-role.mjs, then deploy completely. This preparation does not publish the application or prove email delivery.' >> "$GITHUB_STEP_SUMMARY"
