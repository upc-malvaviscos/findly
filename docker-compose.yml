services:
  floci:
    # Pinned to 2.1.0 (not :latest, not a bare digest: Docker Hub refuses to
    # pull this image's old manifest schema by digest directly). 2.2.0
    # (2026-10-06) rejects conditional (If-None-Match) signed PUTs with 400,
    # breaking write-once selfie uploads. Re-check before moving this forward.
    image: floci/floci:2.1.0
    ports:
      - '${FLOCI_PORT:-4566}:4566'
    environment:
      FLOCI_HOSTNAME: floci
    volumes:
      - floci-data:/var/lib/floci
      - /var/run/docker.sock:/var/run/docker.sock
  local-api:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci --ignore-scripts && npm run dev:api"
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      FINDLY_TABLE_NAME: findly-local
      FINDLY_PHOTO_BUCKET: findly-local-photos
      FINDLY_SELFIE_BUCKET: findly-local-photos
      FINDLY_LOCAL_NO_BIOMETRICS: '1'
      FINDLY_ALLOW_LEGACY_COLLECTIONS: '1'
      CORS_ORIGIN: '*'
      FLOCI_PUBLIC_URL: http://localhost:${FLOCI_PORT:-4566}
    ports:
      - '${LOCAL_API_PORT:-8787}:8787'
    volumes:
      - .:/app
      - local-node-modules:/app/node_modules
    depends_on:
      floci:
        condition: service_healthy
  local-seed:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci --ignore-scripts && node scripts/local-seed-gallery.mjs"
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      FINDLY_TABLE_NAME: findly-local
      FINDLY_PHOTO_BUCKET: findly-local-photos
      WEB_PORT: ${WEB_PORT:-4173}
    volumes:
      - .:/app
      - local-node-modules:/app/node_modules
    depends_on:
      floci:
        condition: service_healthy
volumes:
  floci-data:
  local-node-modules:
